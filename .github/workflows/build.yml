name: Build apps

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tell the app which repository to check for updates
        shell: bash
        run: echo "{\"owner\":\"${GITHUB_REPOSITORY_OWNER}\",\"repo\":\"${GITHUB_REPOSITORY#*/}\"}" > update-config.json

      - name: Install
        run: npm install

      - name: Build installer and portable app
        run: npm run dist

      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: My Pics ${{ steps.v.outputs.version }}
          body: |
            **Windows:** download My-Pics-Setup.exe to install, or My-Pics-Portable.exe to run without installing.
            If Windows says "Windows protected your PC", click More info, then Run anyway.
            Copies that are already installed download new versions by themselves.

            **Mac:** download the .dmg that matches your Mac.
            - Apple chip (M1 or newer): My-Pics-Mac-arm64.dmg
            - Intel: My-Pics-Mac-x64.dmg
            Open the .dmg and drag My Pics into Applications. The first time, macOS may block it. Open System Settings, then Privacy & Security, scroll down and click Open Anyway.
          files: |
            dist/My-Pics-Setup.exe
            dist/My-Pics-Portable.exe
          fail_on_unmatched_files: true
          overwrite_files: true

  mac:
    needs: windows
    runs-on: macos-latest
    continue-on-error: true
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tell the app which repository to check for updates
        run: echo "{\"owner\":\"${GITHUB_REPOSITORY_OWNER}\",\"repo\":\"${GITHUB_REPOSITORY#*/}\"}" > update-config.json

      - name: Install
        run: npm install

      - name: Build Mac disk images
        run: npm run dist:mac

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Add the Mac files to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: My Pics ${{ steps.v.outputs.version }}
          body: |
            **Windows:** download My-Pics-Setup.exe to install, or My-Pics-Portable.exe to run without installing.
            If Windows says "Windows protected your PC", click More info, then Run anyway.
            Copies that are already installed download new versions by themselves.

            **Mac:** download the .dmg that matches your Mac.
            - Apple chip (M1 or newer): My-Pics-Mac-arm64.dmg
            - Intel: My-Pics-Mac-x64.dmg
            Open the .dmg and drag My Pics into Applications. The first time, macOS may block it. Open System Settings, then Privacy & Security, scroll down and click Open Anyway.
          files: dist/My-Pics-Mac-*.dmg
          fail_on_unmatched_files: true
          overwrite_files: true
