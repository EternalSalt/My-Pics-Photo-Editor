name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: windows-latest
    strategy:
      fail-fast: false          # if the speech build has a packaging problem, the lite build still finishes
      matrix:
        variant: [speech, lite]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Install speech reading
        if: matrix.variant == 'speech'
        run: pip install -r requirements-speech.txt

      - name: Build the app
        shell: pwsh
        run: |
          $flags = @("--noconfirm", "--windowed", "--name", "StreamCutter", "--collect-all", "tkinterdnd2")
          if ("${{ matrix.variant }}" -eq "speech") {
            $flags += @("--collect-all", "faster_whisper", "--collect-all", "ctranslate2", "--collect-all", "onnxruntime",
                        "--collect-all", "av", "--collect-all", "tokenizers", "--collect-all", "huggingface_hub")
          }
          pyinstaller @flags main.py

      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path dist/StreamCutter -DestinationPath StreamCutter-${{ matrix.variant }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: StreamCutter-${{ matrix.variant }}-run${{ github.run_number }}
          path: StreamCutter-${{ matrix.variant }}.zip

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StreamCutter-${{ matrix.variant }}.zip
